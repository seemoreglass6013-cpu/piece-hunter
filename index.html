<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knight & Bishop Hunter</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
        }
        h1 {
            font-size: 1.15rem;
            margin: 4px 0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .subtitle {
            font-size: 0.72rem;
            color: #888;
            margin-bottom: 8px;
            text-align: center;
        }
        .mode-selector {
            display: flex;
            background: #1e1e1e;
            padding: 3px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #333;
            width: 90vw;
            max-width: 370px;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #888;
            padding: 6px 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #d97706;
            color: #fff;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
            width: 90vw;
            max-width: 370px;
            margin-bottom: 8px;
            font-size: 0.74rem;
            background: #1e1e1e;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .info-val {
            font-weight: bold;
            color: #2a9d8f;
        }
        .info-val.target {
            color: #ffb703;
        }
        .info-val.today {
            color: #38bdf8;
        }
        .board-wrapper {
            background: #242424;
            padding: 8px 12px 6px 6px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-bottom: 8px;
            border: 1px solid #333;
        }
        .board-middle {
            display: flex;
            align-items: stretch;
        }
        .rank-labels {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            padding-right: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #888;
            text-align: center;
        }
        .rank-labels div {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            width: 80vw;
            max-width: 340px;
            height: 80vw;
            max-height: 340px;
            background-color: #1a1a1a;
            padding: 2px;
            border-radius: 4px;
        }
        .file-labels {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            padding-left: 18px;
            padding-top: 5px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #888;
            text-align: center;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.55rem;
            cursor: pointer;
            position: relative;
            border-radius: 2px;
            overflow: hidden;
            touch-action: manipulation;
        }
        .cell.light {
            background-color: #f0d9b5;
        }
        .cell.dark {
            background-color: #b58863;
        }
        .cell.current-knight {
            background-color: #e63946 !important;
            color: #fff;
        }
        .cell.current-bishop {
            background-color: #2563eb !important;
            color: #fff;
        }
        .cell.target::before {
            content: '★';
            font-size: 1.25rem;
            color: #d97706;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            z-index: 1;
        }
        .cell.dark.target::before {
            color: #fde047;
        }
        .cell.valid-move::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #2a9d8f;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 6px #2a9d8f;
            z-index: 2;
        }
        .cell.target.valid-move::after {
            width: 26px;
            height: 26px;
            background-color: transparent;
            border: 3px solid #2a9d8f;
            border-radius: 50%;
        }
        .cell.sol-step {
            box-shadow: inset 0 0 0 3px #38bdf8;
        }
        .sol-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #0284c7;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 4px;
            z-index: 4;
            line-height: 1.1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        #message {
            margin: 4px 0 6px 0;
            font-size: 0.82rem;
            font-weight: bold;
            color: #ffb703;
            min-height: 1.2rem;
            text-align: center;
            width: 90vw;
            max-width: 370px;
            line-height: 1.4;
        }
        #solution-text {
            display: none;
            width: 90vw;
            max-width: 370px;
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #e0f2fe;
            font-size: 0.74rem;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-align: center;
            word-break: break-all;
        }
        .btn-container {
            display: flex;
            gap: 6px;
            width: 90vw;
            max-width: 370px;
        }
        button.action-btn {
            flex: 1;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 9px 2px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button.action-btn:active {
            background-color: #444;
            transform: scale(0.98);
        }
        button.primary {
            background-color: #2a9d8f;
        }
        button.guide-on {
            background-color: #3b4252;
            border: 1px solid #2a9d8f;
            color: #2a9d8f;
        }
        button.sol-active {
            background-color: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1><span>♞♝</span> Piece Hunter</h1>
    <div class="subtitle">実戦ルール準拠：ビショップは★を飛び越え不可</div>

    <div class="mode-selector">
        <button id="mode-knight" class="mode-btn active" onclick="setMode('KNIGHT')">♞ KNIGHT</button>
        <button id="mode-bishop" class="mode-btn" onclick="setMode('BISHOP')">♝ BISHOP</button>
        <button id="mode-mix" class="mode-btn" onclick="setMode('MIX')">♞⇄♝ MIX</button>
    </div>
    
    <div class="info-panel">
        <div>残り★: <span id="rem-targets" class="info-val">5</span>/5</div>
        <div>手数: <span id="move-count" class="info-val">0</span></div>
        <div>目標: <span id="target-moves" class="info-val target">--</span>手</div>
        <div>今日: <span id="today-plays" class="info-val today">0</span>回</div>
        <div>ベスト: <span id="best-moves" class="info-val">--</span></div>
    </div>

    <div class="board-wrapper">
        <div class="board-middle">
            <div id="rank-labels" class="rank-labels"></div>
            <div id="board" class="board"></div>
        </div>
        <div id="file-labels" class="file-labels"></div>
    </div>

    <div id="message">緑のドット（または★）をタップして移動</div>
    <div id="solution-text"></div>

    <div class="btn-container">
        <button id="guide-btn" class="action-btn guide-on" onclick="toggleGuide()">ガイド: ON</button>
        <button id="sol-btn" class="action-btn" onclick="toggleSolution()">📖 最適解</button>
        <button class="action-btn primary" onclick="initGame(true)">新しい配置</button>
    </div>

    <script>
        const BOARD_SIZE = 8;
        const TARGET_TOTAL = 5;
        const FILES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

        let mode = 'KNIGHT'; 
        let currentPiece = 'KNIGHT'; 
        let pieceR = 4;
        let pieceC = 4;
        let targets = []; 
        let moveCount = 0;
        let showGuide = true;
        let stageClear = false;

        let initialStartR = 0;
        let initialStartC = 0;
        let initialTargets = [];
        let optimalPath = []; 
        let showingSolution = false;

        const boardEl = document.getElementById('board');
        const rankLabelsEl = document.getElementById('rank-labels');
        const fileLabelsEl = document.getElementById('file-labels');
        const remTargetsEl = document.getElementById('rem-targets');
        const moveCountEl = document.getElementById('move-count');
        const targetMovesEl = document.getElementById('target-moves');
        const todayPlaysEl = document.getElementById('today-plays');
        const bestMovesEl = document.getElementById('best-moves');
        const messageEl = document.getElementById('message');
        const solTextEl = document.getElementById('solution-text');
        const guideBtn = document.getElementById('guide-btn');
        const solBtn = document.getElementById('sol-btn');

        const knightOffsets = [
            [-2, -1], [-2, 1], [-1, -2], [-1, 2],
            [1, -2], [1, 2], [2, -1], [2, 1]
        ];
        const bishopDirs = [
            [-1, -1], [-1, 1], [1, -1], [1, 1]
        ];

        function getTodayKey() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `hunter_plays_${y}-${m}-${d}`;
        }

        function getTodayPlays() {
            return parseInt(localStorage.getItem(getTodayKey()) || '0', 10);
        }

        function incrementTodayPlays() {
            const nextVal = getTodayPlays() + 1;
            localStorage.setItem(getTodayKey(), String(nextVal));
            todayPlaysEl.textContent = nextVal;
        }

        function toCoord(r, c) {
            return `${FILES[c]}${8 - r}`;
        }

        function initCoordinates() {
            rankLabelsEl.innerHTML = '';
            fileLabelsEl.innerHTML = '';
            for (let i = 8; i >= 1; i--) {
                const div = document.createElement('div');
                div.textContent = i;
                rankLabelsEl.appendChild(div);
            }
            for (let i = 0; i < 8; i++) {
                const div = document.createElement('div');
                div.textContent = FILES[i];
                fileLabelsEl.appendChild(div);
            }
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('mode-knight').classList.toggle('active', mode === 'KNIGHT');
            document.getElementById('mode-bishop').classList.toggle('active', mode === 'BISHOP');
            document.getElementById('mode-mix').classList.toggle('active', mode === 'MIX');
            initGame(false);
        }

        function toggleGuide() {
            showGuide = !showGuide;
            guideBtn.textContent = showGuide ? 'ガイド: ON' : 'ガイド: OFF';
            guideBtn.classList.toggle('guide-on', showGuide);
            renderBoard();
        }

        function updateBestDisplay() {
            const best = localStorage.getItem(`hunter_best_${mode}`);
            bestMovesEl.textContent = best ? `${best}手` : '--';
        }

        // 飛び越し禁止ルールに完全準拠した合法手生成（activeTargetsを障害物として扱う）
        function getValidMoves(r, c, pieceType, activeTargets = targets) {
            const moves = [];
            if (pieceType === 'KNIGHT') {
                // ナイトは他の駒を飛び越えられる
                for (const [dr, dc] of knightOffsets) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        moves.push([nr, nc]);
                    }
                }
            } else {
                // ビショップは途中に未回収の★があるとそのマスで止まり、奥へは進めない
                for (const [dr, dc] of bishopDirs) {
                    let nr = r + dr;
                    let nc = c + dc;
                    while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                        moves.push([nr, nc]);
                        if (activeTargets.some(t => t.r === nr && t.c === nc)) {
                            break; // ★を捕獲した地点でストップ（飛び越し不可）
                        }
                        nr += dr;
                        nc += dc;
                    }
                }
            }
            return moves;
        }

        // 生成されたルートが、飛び越し禁止ルール下で実際に実行可能かを検証する関数
        function isPathValidUnderRules(startR, startC, initialPiece, path, targetList) {
            let simR = startR;
            let simC = startC;
            let simPiece = initialPiece;
            let remTargets = targetList.map(t => ({ ...t }));

            for (const step of path) {
                const validMoves = getValidMoves(simR, simC, simPiece, remTargets);
                const canReach = validMoves.some(m => m[0] === step.r && m[1] === step.c);
                if (!canReach) {
                    return false;
                }
                simR = step.r;
                simC = step.c;
                remTargets = remTargets.filter(t => !(t.r === simR && t.c === simC));
                if (mode === 'MIX') {
                    simPiece = (simPiece === 'KNIGHT') ? 'BISHOP' : 'KNIGHT';
                }
            }
            return remTargets.length === 0;
        }

        function initGame(countAsChallenge = true) {
            moveCount = 0;
            stageClear = false;
            showingSolution = false;
            solBtn.classList.remove('sol-active');
            solTextEl.style.display = 'none';

            currentPiece = (mode === 'BISHOP') ? 'BISHOP' : 'KNIGHT';

            let validSetup = false;
            let maxTry = 250;

            while (!validSetup && maxTry > 0) {
                maxTry--;
                pieceR = Math.floor(Math.random() * BOARD_SIZE);
                pieceC = Math.floor(Math.random() * BOARD_SIZE);
                const startParity = (pieceR + pieceC) % 2;

                let currR = pieceR;
                let currC = pieceC;
                let currP = currentPiece;
                let tempTargets = [];
                let tempPath = [];
                let visitedCoords = new Set([`${pieceR},${pieceC}`]);
                let failed = false;

                const desiredTotalSteps = (Math.random() < 0.65)
                    ? TARGET_TOTAL + 1 + Math.floor(Math.random() * 4) // 6〜9手
                    : TARGET_TOTAL; // 5手

                const extraTransitSteps = desiredTotalSteps - TARGET_TOTAL;
                let transitBeforeIndices = new Set();
                while (transitBeforeIndices.size < extraTransitSteps) {
                    transitBeforeIndices.add(Math.floor(Math.random() * TARGET_TOTAL));
                }

                for (let tIdx = 0; tIdx < TARGET_TOTAL; tIdx++) {
                    if (transitBeforeIndices.has(tIdx)) {
                        let tMoves = getValidMoves(currR, currC, currP, []);
                        if (mode === 'BISHOP') {
                            tMoves = tMoves.filter(m => (m[0] + m[1]) % 2 === startParity);
                        }
                        tMoves = tMoves.filter(m => !visitedCoords.has(`${m[0]},${m[1]}`));
                        if (tMoves.length === 0) {
                            failed = true;
                            break;
                        }
                        const mid = tMoves[Math.floor(Math.random() * tMoves.length)];
                        tempPath.push({ r: mid[0], c: mid[1], usedPiece: currP, isTarget: false });
                        visitedCoords.add(`${mid[0]},${mid[1]}`);
                        currR = mid[0];
                        currC = mid[1];
                        if (mode === 'MIX') {
                            currP = (currP === 'KNIGHT') ? 'BISHOP' : 'KNIGHT';
                        }
                    }

                    let moves = getValidMoves(currR, currC, currP, []);
                    if (mode === 'BISHOP') {
                        moves = moves.filter(m => (m[0] + m[1]) % 2 === startParity);
                    }
                    moves = moves.filter(m => !visitedCoords.has(`${m[0]},${m[1]}`));

                    if (moves.length === 0) {
                        failed = true;
                        break;
                    }
                    const next = moves[Math.floor(Math.random() * moves.length)];
                    tempTargets.push({ r: next[0], c: next[1] });
                    tempPath.push({ r: next[0], c: next[1], usedPiece: currP, isTarget: true });
                    visitedCoords.add(`${next[0]},${next[1]}`);

                    currR = next[0];
                    currC = next[1];
                    if (mode === 'MIX') {
                        currP = (currP === 'KNIGHT') ? 'BISHOP' : 'KNIGHT';
                    }
                }

                // 後から配置された★が途中の斜線を塞いでいないか厳密チェック
                if (!failed && tempTargets.length === TARGET_TOTAL) {
                    if (isPathValidUnderRules(pieceR, pieceC, currentPiece, tempPath, tempTargets)) {
                        targets = tempTargets;
                        optimalPath = tempPath;
                        validSetup = true;
                    }
                }
            }

            // フォールバック（確実に飛び越しなしで解ける配置）
            if (!validSetup) {
                if (mode === 'BISHOP') {
                    pieceR = 7; pieceC = 2; // C1
                    targets = [{r: 5, c: 0}, {r: 2, c: 3}, {r: 0, c: 1}, {r: 4, c: 5}, {r: 7, c: 2}];
                    targets = [{r: 5, c: 0}, {r: 2, c: 3}, {r: 0, c: 1}, {r: 3, c: 4}, {r: 6, c: 7}];
                    optimalPath = targets.map(t => ({r: t.r, c: t.c, usedPiece: 'BISHOP', isTarget: true}));
                } else {
                    pieceR = 3; pieceC = 3;
                    targets = [{r:1, c:2}, {r:2, c:4}, {r:4, c:5}, {r:6, c:4}, {r:5, c:2}];
                    optimalPath = targets.map(t => ({r: t.r, c: t.c, usedPiece: currentPiece, isTarget: true}));
                }
            }

            initialStartR = pieceR;
            initialStartC = pieceC;
            initialTargets = targets.map(t => ({ ...t }));

            targetMovesEl.textContent = optimalPath.length;
            todayPlaysEl.textContent = getTodayPlays();

            if (countAsChallenge) {
                incrementTodayPlays();
            }

            updateBestDisplay();
            updateStatusMessage();
            renderBoard();
        }

        function toggleSolution() {
            if (!optimalPath || optimalPath.length === 0) return;

            showingSolution = !showingSolution;
            solBtn.classList.toggle('sol-active', showingSolution);

            if (showingSolution) {
                const startCoord = toCoord(initialStartR, initialStartC);
                const stepsStr = optimalPath.map((step, idx) => {
                    const icon = step.usedPiece === 'KNIGHT' ? '♞' : '♝';
                    const mark = step.isTarget ? '★' : '';
                    return `${idx + 1}.${icon}${mark}${toCoord(step.r, step.c)}`;
                }).join(' → ');

                solTextEl.innerHTML = `<strong>【模範ルート（${optimalPath.length}手）】</strong><br>開始(${startCoord}) → ${stepsStr}`;
                solTextEl.style.display = 'block';
                messageEl.textContent = '📖 模範ルートを表示中';
            } else {
                solTextEl.style.display = 'none';
                if (stageClear) {
                    messageEl.textContent = `クリア！ ${moveCount}手で全回収`;
                } else {
                    updateStatusMessage();
                }
            }
            renderBoard();
        }

        function updateStatusMessage() {
            if (stageClear) return;
            if (mode === 'MIX') {
                const pName = currentPiece === 'KNIGHT' ? '♞ナイト（L字）' : '♝ビショップ（斜め）';
                messageEl.textContent = `次は ${pName} の動きで移動！`;
            } else if (mode === 'KNIGHT') {
                messageEl.textContent = '♞ ナイトのL字移動で★をすべて回収しよう';
            } else {
                messageEl.textContent = '♝ ビショップ（飛び越し不可）で★を回収しよう';
            }
        }

        function renderBoard() {
            boardEl.innerHTML = '';

            const dispR = showingSolution ? initialStartR : pieceR;
            const dispC = showingSolution ? initialStartC : pieceC;
            const dispTargets = showingSolution ? initialTargets : targets;
            const dispPiece = showingSolution ? ((mode === 'BISHOP') ? 'BISHOP' : 'KNIGHT') : currentPiece;

            const validMoves = (stageClear || showingSolution) ? [] : getValidMoves(dispR, dispC, dispPiece, dispTargets);

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

                    if (r === dispR && c === dispC) {
                        if (dispPiece === 'KNIGHT') {
                            cell.classList.add('current-knight');
                            cell.textContent = '♞';
                        } else {
                            cell.classList.add('current-bishop');
                            cell.textContent = '♝';
                        }
                    } else {
                        if (dispTargets.some(t => t.r === r && t.c === c)) {
                            cell.classList.add('target');
                        }
                        if (showGuide && validMoves.some(m => m[0] === r && m[1] === c)) {
                            cell.classList.add('valid-move');
                        }
                    }

                    if (showingSolution) {
                        const matchedSteps = [];
                        optimalPath.forEach((step, idx) => {
                            if (step.r === r && step.c === c) {
                                matchedSteps.push(idx + 1);
                            }
                        });
                        if (matchedSteps.length > 0) {
                            cell.classList.add('sol-step');
                            const badge = document.createElement('span');
                            badge.className = 'sol-badge';
                            badge.textContent = matchedSteps.join(',');
                            cell.appendChild(badge);
                        }
                    }

                    cell.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        handleCellTap(r, c);
                    });

                    boardEl.appendChild(cell);
                }
            }

            remTargetsEl.textContent = targets.length;
            moveCountEl.textContent = moveCount;
        }

        function handleCellTap(r, c) {
            if (showingSolution) {
                toggleSolution();
                return;
            }
            if (stageClear) return;
            if (r === pieceR && c === pieceC) return;

            const validMoves = getValidMoves(pieceR, pieceC, currentPiece, targets);
            const isValid = validMoves.some(m => m[0] === r && m[1] === c);

            if (!isValid) {
                const errMsg = currentPiece === 'KNIGHT'
                    ? 'そこはナイトのL字（2×1）ではありません！'
                    : '斜めラインではないか、途中の★が遮っています！';
                messageEl.textContent = errMsg;
                setTimeout(updateStatusMessage, 1200);
                return;
            }

            pieceR = r;
            pieceC = c;
            moveCount++;

            targets = targets.filter(t => !(t.r === r && t.c === c));

            if (mode === 'MIX') {
                currentPiece = (currentPiece === 'KNIGHT') ? 'BISHOP' : 'KNIGHT';
            }

            if (targets.length === 0) {
                stageClear = true;
                const key = `hunter_best_${mode}`;
                const prevBest = parseInt(localStorage.getItem(key) || '999', 10);
                let recordText = '';
                if (moveCount < prevBest) {
                    localStorage.setItem(key, String(moveCount));
                    recordText = '（🎉 自己ベスト更新！）';
                }
                updateBestDisplay();
                messageEl.textContent = `クリア！ ${moveCount}手で全回収 ${recordText}`;
            } else {
                updateStatusMessage();
            }

            renderBoard();
        }

        initCoordinates();
        todayPlaysEl.textContent = getTodayPlays();
        initGame(true);
    </script>
</body>
</html>
