<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knight & Bishop Hunter</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
        }
        h1 {
            font-size: 1.15rem;
            margin: 4px 0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .subtitle {
            font-size: 0.72rem;
            color: #888;
            margin-bottom: 8px;
            text-align: center;
        }
        .mode-selector {
            display: flex;
            background: #1e1e1e;
            padding: 3px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #333;
            width: 88vw;
            max-width: 360px;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #888;
            padding: 6px 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #d97706;
            color: #fff;
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            width: 88vw;
            max-width: 360px;
            margin-bottom: 8px;
            font-size: 0.78rem;
            background: #1e1e1e;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .info-val {
            font-weight: bold;
            color: #2a9d8f;
        }
        .info-val.target {
            color: #ffb703;
        }
        /* 座標を含めた盤面コンテナ */
        .board-wrapper {
            background: #242424;
            padding: 8px 12px 6px 6px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-bottom: 8px;
            border: 1px solid #333;
        }
        .board-middle {
            display: flex;
            align-items: stretch;
        }
        .rank-labels {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            padding-right: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #888;
            text-align: center;
        }
        .rank-labels div {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            width: 80vw;
            max-width: 340px;
            height: 80vw;
            max-height: 340px;
            background-color: #1a1a1a;
            padding: 2px;
            border-radius: 4px;
        }
        .file-labels {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            padding-left: 18px;
            padding-top: 5px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #888;
            text-align: center;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.55rem;
            cursor: pointer;
            position: relative;
            border-radius: 2px;
            overflow: hidden;
            touch-action: manipulation;
        }
        .cell.light {
            background-color: #f0d9b5;
        }
        .cell.dark {
            background-color: #b58863;
        }
        .cell.current-knight {
            background-color: #e63946 !important;
            color: #fff;
        }
        .cell.current-bishop {
            background-color: #2563eb !important;
            color: #fff;
        }
        .cell.target::before {
            content: '★';
            font-size: 1.25rem;
            color: #d97706;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            z-index: 1;
        }
        .cell.dark.target::before {
            color: #fde047;
        }
        .cell.valid-move::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: #2a9d8f;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 6px #2a9d8f;
            z-index: 2;
        }
        .cell.target.valid-move::after {
            width: 26px;
            height: 26px;
            background-color: transparent;
            border: 3px solid #2a9d8f;
            border-radius: 50%;
        }
        /* 最適解表示用のスタイル */
        .cell.sol-step {
            box-shadow: inset 0 0 0 3px #38bdf8;
        }
        .sol-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #0284c7;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 4px;
            z-index: 4;
            line-height: 1.1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        #message {
            margin: 4px 0 6px 0;
            font-size: 0.82rem;
            font-weight: bold;
            color: #ffb703;
            min-height: 1.2rem;
            text-align: center;
            width: 88vw;
            max-width: 360px;
            line-height: 1.4;
        }
        #solution-text {
            display: none;
            width: 88vw;
            max-width: 360px;
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #e0f2fe;
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-align: center;
            word-break: break-all;
        }
        .btn-container {
            display: flex;
            gap: 6px;
            width: 88vw;
            max-width: 360px;
        }
        button.action-btn {
            flex: 1;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 9px 2px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button.action-btn:active {
            background-color: #444;
            transform: scale(0.98);
        }
        button.primary {
            background-color: #2a9d8f;
        }
        button.guide-on {
            background-color: #3b4252;
            border: 1px solid #2a9d8f;
            color: #2a9d8f;
        }
        button.sol-active {
            background-color: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1><span>♞♝</span> Piece Hunter</h1>
    <div class="subtitle">全5個の★を最短手数で回収せよ（無音・オフライン）</div>

    <div class="mode-selector">
        <button id="mode-knight" class="mode-btn active" onclick="setMode('KNIGHT')">♞ KNIGHT</button>
        <button id="mode-bishop" class="mode-btn" onclick="setMode('BISHOP')">♝ BISHOP</button>
        <button id="mode-mix" class="mode-btn" onclick="setMode('MIX')">♞⇄♝ MIX</button>
    </div>
    
    <div class="info-panel">
        <div>残り★: <span id="rem-targets" class="info-val">5</span>/5</div>
        <div>手数: <span id="move-count" class="info-val">0</span></div>
        <div>目標: <span id="target-moves" class="info-val target">--</span>手</div>
        <div>自己ベスト: <span id="best-moves" class="info-val">--</span></div>
    </div>

    <div class="board-wrapper">
        <div class="board-middle">
            <div id="rank-labels" class="rank-labels"></div>
            <div id="board" class="board"></div>
        </div>
        <div id="file-labels" class="file-labels"></div>
    </div>

    <div id="message">緑のドット（または★）をタップして移動</div>
    <div id="solution-text"></div>

    <div class="btn-container">
        <button id="guide-btn" class="action-btn guide-on" onclick="toggleGuide()">ガイド: ON</button>
        <button id="sol-btn" class="action-btn" onclick="toggleSolution()">📖 最適解</button>
        <button class="action-btn primary" onclick="initGame()">新しい配置</button>
    </div>

    <script>
        const BOARD_SIZE = 8;
        const TARGET_TOTAL = 5;
        const FILES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

        let mode = 'KNIGHT'; 
        let currentPiece = 'KNIGHT'; 
        let pieceR = 4;
        let pieceC = 4;
        let targets = []; 
        let moveCount = 0;
        let showGuide = true;
        let stageClear = false;

        // 初期状態と最適解の保持用
        let initialStartR = 0;
        let initialStartC = 0;
        let initialTargets = [];
        let optimalPath = []; // [{r, c, piece}]
        let showingSolution = false;

        const boardEl = document.getElementById('board');
        const rankLabelsEl = document.getElementById('rank-labels');
        const fileLabelsEl = document.getElementById('file-labels');
        const remTargetsEl = document.getElementById('rem-targets');
        const moveCountEl = document.getElementById('move-count');
        const targetMovesEl = document.getElementById('target-moves');
        const bestMovesEl = document.getElementById('best-moves');
        const messageEl = document.getElementById('message');
        const solTextEl = document.getElementById('solution-text');
        const guideBtn = document.getElementById('guide-btn');
        const solBtn = document.getElementById('sol-btn');

        const knightOffsets = [
            [-2, -1], [-2, 1], [-1, -2], [-1, 2],
            [1, -2], [1, 2], [2, -1], [2, 1]
        ];
        const bishopDirs = [
            [-1, -1], [-1, 1], [1, -1], [1, 1]
        ];

        function toCoord(r, c) {
            return `${FILES[c]}${8 - r}`;
        }

        function initCoordinates() {
            rankLabelsEl.innerHTML = '';
            fileLabelsEl.innerHTML = '';
            for (let i = 8; i >= 1; i--) {
                const div = document.createElement('div');
                div.textContent = i;
                rankLabelsEl.appendChild(div);
            }
            for (let i = 0; i < 8; i++) {
                const div = document.createElement('div');
                div.textContent = FILES[i];
                fileLabelsEl.appendChild(div);
            }
        }

        function setMode(newMode) {
            mode = newMode;
            document.getElementById('mode-knight').classList.toggle('active', mode === 'KNIGHT');
            document.getElementById('mode-bishop').classList.toggle('active', mode === 'BISHOP');
            document.getElementById('mode-mix').classList.toggle('active', mode === 'MIX');
            initGame();
        }

        function toggleGuide() {
            showGuide = !showGuide;
            guideBtn.textContent = showGuide ? 'ガイド: ON' : 'ガイド: OFF';
            guideBtn.classList.toggle('guide-on', showGuide);
            renderBoard();
        }

        function updateBestDisplay() {
            const best = localStorage.getItem(`hunter_best_${mode}`);
            bestMovesEl.textContent = best ? `${best}手` : '--';
        }

        function initGame() {
            moveCount = 0;
            stageClear = false;
            showingSolution = false;
            solBtn.classList.remove('sol-active');
            solTextEl.style.display = 'none';

            currentPiece = (mode === 'BISHOP') ? 'BISHOP' : 'KNIGHT';

            // 確実に解が存在する配置を生成
            let foundPath = null;
            while (!foundPath) {
                pieceR = Math.floor(Math.random() * BOARD_SIZE);
                pieceC = Math.floor(Math.random() * BOARD_SIZE);
                const startParity = (pieceR + pieceC) % 2;

                targets = [];
                while (targets.length < TARGET_TOTAL) {
                    const r = Math.floor(Math.random() * BOARD_SIZE);
                    const c = Math.floor(Math.random() * BOARD_SIZE);
                    if (r === pieceR && c === pieceC) continue;
                    if (targets.some(t => t.r === r && t.c === c)) continue;
                    if (mode === 'BISHOP' && (r + c) % 2 !== startParity) continue;
                    targets.push({ r, c });
                }

                foundPath = findOptimalPath(pieceR, pieceC, targets, currentPiece, mode);
            }

            initialStartR = pieceR;
            initialStartC = pieceC;
            initialTargets = targets.map(t => ({ ...t }));
            optimalPath = foundPath;

            targetMovesEl.textContent = optimalPath.length;

            updateBestDisplay();
            updateStatusMessage();
            renderBoard();
        }

        // BFS（幅優先探索）で全★回収の最短経路そのものを求める
        function findOptimalPath(startR, startC, targetList, initialPiece, currentMode) {
            let queue = [{
                r: startR,
                c: startC,
                piece: initialPiece,
                mask: 0,
                path: []
            }];
            let visited = new Set();
            let fullMask = (1 << targetList.length) - 1;

            visited.add(`${startR},${startC},${initialPiece},0`);

            let iterations = 0;
            while (queue.length > 0 && iterations < 35000) {
                let curr = queue.shift();
                iterations++;

                if (curr.mask === fullMask) {
                    return curr.path;
                }

                let validMoves = getValidMoves(curr.r, curr.c, curr.piece);

                for (let [nr, nc] of validMoves) {
                    let nextMask = curr.mask;
                    let targetIdx = targetList.findIndex(t => t.r === nr && t.c === nc);
                    if (targetIdx !== -1) {
                        nextMask |= (1 << targetIdx);
                    }

                    let nextPiece = (currentMode === 'MIX')
                        ? (curr.piece === 'KNIGHT' ? 'BISHOP' : 'KNIGHT')
                        : curr.piece;
                    let stateKey = `${nr},${nc},${nextPiece},${nextMask}`;

                    if (!visited.has(stateKey)) {
                        visited.add(stateKey);
                        queue.push({
                            r: nr,
                            c: nc,
                            piece: nextPiece,
                            mask: nextMask,
                            path: [...curr.path, { r: nr, c: nc, usedPiece: curr.piece }]
                        });
                    }
                }
            }
            return null;
        }

        function toggleSolution() {
            if (!optimalPath || optimalPath.length === 0) return;

            showingSolution = !showingSolution;
            solBtn.classList.toggle('sol-active', showingSolution);

            if (showingSolution) {
                const startCoord = toCoord(initialStartR, initialStartC);
                const stepsStr = optimalPath.map((step, idx) => {
                    const icon = step.usedPiece === 'KNIGHT' ? '♞' : '♝';
                    return `${idx + 1}.${icon}${toCoord(step.r, step.c)}`;
                }).join(' → ');

                solTextEl.innerHTML = `<strong>【最短 ${optimalPath.length}手 ルート】</strong><br>開始(${startCoord}) → ${stepsStr}`;
                solTextEl.style.display = 'block';
                messageEl.textContent = '📖 初期配置からの最短ルートを表示中';
            } else {
                solTextEl.style.display = 'none';
                if (stageClear) {
                    messageEl.textContent = `クリア！ ${moveCount}手で全回収（目標: ${optimalPath.length}手）`;
                } else {
                    updateStatusMessage();
                }
            }
            renderBoard();
        }

        function updateStatusMessage() {
            if (stageClear) return;
            if (mode === 'MIX') {
                const pName = currentPiece === 'KNIGHT' ? '♞ナイト
